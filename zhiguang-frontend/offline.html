<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纸域空间 - 离线页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    
    .offline-container {
      text-align: center;
      max-width: 500px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    
    .offline-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    .offline-title {
      font-size: 32px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    
    .offline-message {
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .retry-button {
      background: #fff;
      color: #667eea;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    
    .retry-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    .cached-pages {
      margin-top: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }
    
    .cached-pages-title {
      font-size: 16px;
      margin-bottom: 15px;
    }
    
    .cached-pages-list {
      list-style: none;
    }
    
    .cached-pages-list li {
      margin: 10px 0;
    }
    
    .cached-pages-list a {
      color: #fff;
      text-decoration: none;
      transition: color 0.3s;
    }
    
    .cached-pages-list a:hover {
      color: #ffd700;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">网络连接中断</h1>
    <p class="offline-message">
      您当前处于离线状态，无法访问新内容。<br>
      但您可以查看已缓存的页面，或等待网络恢复后重试。
    </p>
    <button class="retry-button" onclick="window.location.reload()">
      🔄 重新连接
    </button>
    
    <div class="cached-pages">
      <h3 class="cached-pages-title">📖 已缓存的页面</h3>
      <ul class="cached-pages-list" id="cached-pages-list">
        <!-- 动态填充已缓存的页面 -->
      </ul>
    </div>
  </div>
  
  <script>
    // 获取已缓存的页面
    if ('serviceWorker' in navigator && 'caches' in window) {
      caches.open('api-cache').then(cache => {
        cache.keys().then(keys => {
          const list = document.getElementById('cached-pages-list');
          keys.forEach(key => {
            if (key.url.includes('/api/articles/') || key.url.includes('/api/books/')) {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = key.url.replace('/api/', '/');
              a.textContent = key.url.split('/').pop();
              li.appendChild(a);
              list.appendChild(li);
            }
          });
          
          if (list.children.length === 0) {
            list.innerHTML = '<li>暂无已缓存的页面</li>';
          }
        });
      });
    }
    
    // 监听网络恢复
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
