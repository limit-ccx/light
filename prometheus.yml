global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - /etc/prometheus/alert_rules.yml

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'zhiguang-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'zhiguang-backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']

  - job_name: 'elasticsearch'
    metrics_path: '/_nodes/stats'
    static_configs:
      - targets: ['elasticsearch:9200']