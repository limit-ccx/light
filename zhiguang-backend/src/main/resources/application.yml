server:
  port: 8081
  # 信任反向代理的 X-Forwarded-* 头，使后端能正确识别 HTTPS 和真实 IP
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    context-path: /

spring:
  application:
    name: zhiguang-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  web:
    resources:
      static-locations: classpath:/static/,file:./uploads/

  # 主从数据源配置（读写分离）
  datasource:
    master:
      url: ${MYSQL_MASTER_URL:jdbc:mysql://localhost:3308/zhiguang?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci}
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        connection-timeout: 10000
        max-lifetime: 1800000
        idle-timeout: 600000
        leak-detection-threshold: 60000
        pool-name: HikariMaster
    replica:
      url: ${MYSQL_REPLICA_URL:jdbc:mysql://localhost:3308/zhiguang?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci}
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 50
        minimum-idle: 20
        connection-timeout: 10000
        max-lifetime: 1800000
        idle-timeout: 600000
        leak-detection-threshold: 60000
        pool-name: HikariReplica

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # 批量操作优化（P0）：减少逐条插入/更新的网络往返
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # 懒加载批量抓取，缓解 N+1 查询
        default_batch_fetch_size: 25

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 60000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000

  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-attempts: 3

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Redisson 分布式锁配置
  redisson:
    config: |
      singleServerConfig:
        address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6380}
        connectionPoolSize: 20
        connectionMinimumIdleSize: 5
        idleConnectionTimeout: 10000
        connectTimeout: 10000
        timeout: 3000
        retryAttempts: 3
        retryInterval: 1500

# Actuator 监控配置
# 收敛暴露面：health 保留给探活（不出详情），prometheus 供内网抓取；
# info/metrics 端点移除。生产建议再叠加内网访问控制或独立 management 端口。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    elasticsearch:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  # 密钥通过环境变量注入，避免硬编码；默认值仅用于本地开发
  secret: ${JWT_SECRET:ZhiguangPlatformSecretKey2024ThisIsAVeryLongSecretKeyForJWTTokenGeneration}
  expiration: 86400000

# 树洞匿名身份（服务端签发 HMAC 签名 token，见 TreeHoleIdentityService）
tree-hole:
  identity-ttl-days: 30        # token 有效期
  legacy-identity-accepted: true  # 过渡期兼容旧格式 UUID 身份；存量切换完成后改 false 收紧

# CORS 允许的来源（生产环境必须指定具体域名，多个用逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.zhiguang: DEBUG

ai:
  provider: deepseek
  # 密钥必须通过环境变量注入（原明文密钥已泄露，务必在 DeepSeek 控制台吊销轮换）
  api-key: ${AI_API_KEY:}
  model: deepseek-chat
  base-url: https://api.deepseek.com/v1
  max-content-length: 10000
  timeout-seconds: 60
  # 每用户每日 AI 调用配额（润色/写作助手/一键生成/流式等全部 LLM 端点）；<=0 不限制
  daily-quota: 50
  # 多平台模型（管理端 Agent 模型选择；密钥仅从环境变量注入，仓库零明文）
  providers:
    deepseek:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      reasoning-model: deepseek-reasoner
    glm:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${GLM_API_KEY:}
      model: glm-4-flash
      reasoning-model: glm-z1-flash
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY:}
      model: qwen-plus
      reasoning-model: qwen-plus
    mimo:
      base-url: ${MIMO_BASE_URL:}
      api-key: ${MIMO_API_KEY:}
      model: MiMo-7B-RL
      reasoning-model: MiMo-7B-RL
  # 真实 Embedding 服务（OpenAI 兼容 /embeddings；未配置 api-key 时降级 LLM 伪向量，仅限开发）
  # dimension 必须与 vector.postgres.dimension 一致；换模型后须重建表并全量重嵌入（管理端接口）
  embedding:
    api-key: ${AI_EMBEDDING_API_KEY:}
    base-url: ${AI_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
    model: ${AI_EMBEDDING_MODEL:BAAI/bge-m3}
    dimension: 1024
  # 润色模式提示词可在此覆盖（prompt / temperature / max-tokens），示例：
  # prompts:
  #   polish:
  #     temperature: 0.4
  #     max-tokens: 4096
  #     prompt: "自定义润色提示词"

# 管理员智能体（运营助手，ReAct 架构）
admin-agent:
  enabled: true
  max-iterations: 8            # LoopGuard L1
  max-tool-calls: 15           # L2
  empty-short-circuit: 2       # L4
  token-budget: 32000          # L5
  request-timeout-seconds: 120
  max-drafts-per-request: 5    # L7
  pending-ttl-minutes: 10
  history-keeps: 16
  daily-quota: 100
  temperature: 0.2
  reply-max-tokens: 1000
  rag:
    top-k: 5
    min-score: 0.35

# 导览助手（Agent）
agent:
  enabled: true
  max-iterations: 4
  history-keeps: 10
  max-input-chars: 500
  tool-timeout-ms: 3000
  request-timeout-seconds: 60
  temperature: 0.4
  reply-max-tokens: 800
  prompt-version: v2

# 文件上传配置
file:
  upload-dir: uploads
  base-url: http://localhost:8081

# Elasticsearch 配置
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: 9200
  username: elastic
  password: elastic123
  index:
    article: zhiguang_articles

# 向量检索配置（pgvector）
vector:
  provider: pgvector
  postgres:
    host: ${VECTOR_POSTGRES_HOST:localhost}
    port: 5432
    database: zhiguang_vectors
    username: ${VECTOR_POSTGRES_USER:postgres}
    password: ${VECTOR_POSTGRES_PASSWORD:postgres123}
    # 须与 ai.embedding.dimension 一致（默认 bge-m3 = 1024）；表结构按此维度创建
    dimension: 1024

# MinIO 对象存储配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: minioadmin
  secret-key: minioadmin
  bucket: zhiguang-media
  secure: false

# SkyWalking 链路追踪配置
skywalking:
  agent:
    service-name: zhiguang-backend
    collector-backend: ${SKYWALKING_COLLECTOR:localhost:11800}
    sampling-rate: 5000  # 采样率 50%

# 限流配置
rate-limit:
  enabled: true
  default-limit: 100
  default-window: 60
  endpoints:
    "[/api/auth/login]": "5,60"
    "[/api/auth/register]": "5,3600"
    "[/api/auth/refresh]": "30,60"
    "[/api/auth/logout]": "30,60"
    "[/api/auth/sse-ticket]": "60,60"
    # AI 端点独立限流（LLM 调用成本高，收紧到远低于全局默认值）
    "[POST /api/ai/polish]": "10,60"
    "[POST /api/ai/polish/stream]": "10,60"
    "[POST /api/ai/summarize/**]": "10,60"
    "[POST /api/ai/write/**]": "15,60"
    "[POST /api/ai/comment/**]": "10,60"
    "[POST /api/ai/knowledge/**]": "10,60"
    # 私信：发消息 30 次/分，已读标记 30 次/分（M-9）
    "[POST /api/agent/chat]": "10,60"
    "[POST /api/admin/agent/chat]": "20,60"
    "[POST /api/agent/feedback]": "10,60"
    "[POST /api/messages/*]": "30,60"
    "[POST /api/messages/conversation/*/read]": "30,60"
    "[/api/articles/*/like]": "10,60"
    "[/api/comments]": "10,60"
    "[/api/search]": "30,60"
    "[/api/tree-hole]": "5,3600"
    # 后台敏感操作限流
    "[/api/admin/users/*/ban]": "20,60"
    "[/api/admin/users/*/unban]": "20,60"
    "[/api/admin/users/*/reset-password]": "10,60"
    "[/api/admin/users/*/role]": "10,60"
    "[/api/admin/content/articles/*/review]": "30,60"
    "[/api/admin/content/comments/*/review]": "30,60"
    "[/api/admin/content/reports/*/handle]": "30,60"
    "[/api/admin/tree-hole/posts/*/approve]": "30,60"
    "[/api/admin/tree-hole/posts/*/reject]": "30,60"
    "[/api/admin/tree-hole/posts]": "20,60"
    "[/api/admin/tree-hole/reports/*/resolve]": "30,60"
