# ================================================================
# ⚠️ 安全警告（SEC-P1-6，2026-10-24）：
# Secret 的 data 字段只是 base64 编码，提交进仓库等于明文泄露凭据。
# 正确做法（三选一，按团队条件选择后删除本文件中的真实值）：
#   1. sealed-secrets：kubeseal 生成加密 SealedSecret 后提交；
#   2. 外部密管：External Secrets Operator / Vault / 云 KMS；
#   3. 最简兜底：本文件改为 secrets.example.yaml 模板（占位符），
#      真实值在部署时由 CI 注入，绝不入库。
# 迁移完成前，本文件中的口令一律视为已泄露，需全部轮换。
# ================================================================
