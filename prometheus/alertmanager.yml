global:
  resolve_timeout: 5m

# 路由配置
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'zhiguang-alerts'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'

# 接收器配置
receivers:
  - name: 'zhiguang-alerts'
    webhook_configs:
      - url: 'http://app:8081/api/admin/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://app:8081/api/admin/alerts/critical'
        send_resolved: true
    # 可添加邮件/钉钉/Slack 等通知方式
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alerts@zhiguang.com'
    #     smarthost: 'smtp.example.com:587'

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://app:8081/api/admin/alerts/warning'
        send_resolved: true

# 抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']