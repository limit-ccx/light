# ================================================
# 纸域空间平台 Nginx 配置
# 功能：
#   1. HTTP -> HTTPS 301 强制重定向
#   2. SSL/TLS 配置（仅允许现代加密套件）
#   3. 安全响应头（HSTS、X-Frame-Options 等）
#   4. 反向代理前端 + 后端 API
#   5. 静态资源缓存策略
# ================================================

# HTTP -> HTTPS 强制重定向
server {
    listen 80;
    server_name zhiguang.com www.zhiguang.com;

    # 所有 HTTP 请求 301 永久重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name zhiguang.com www.zhiguang.com;

    # ========== SSL 证书 ==========
    ssl_certificate     /etc/nginx/ssl/zhiguang.crt;
    ssl_certificate_key /etc/nginx/ssl/zhiguang.key;

    # 仅允许 TLS 1.2+，禁用不安全协议
    ssl_protocols TLSv1.2 TLSv1.3;
    # 仅允许安全加密套件
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ========== 安全响应头 ==========
    # HSTS：强制浏览器后续所有请求走 HTTPS（2年）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # 禁止页面被嵌入 iframe（防点击劫持）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 禁止 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 反射型 XSS 保护
    add_header X-XSS-Protection "1; mode=block" always;
    # 内容安全策略：script-src 已移除 unsafe-inline（构建产物无内联脚本，SEC-P2-5 加强）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'self';" always;
    # 隐藏 Nginx 版本号
    server_tokens off;

    # ========== 前端静态资源 ==========
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（1年）
    # 注意：此 location 自带 add_header，会使 server 级安全头失效（nginx 继承规则），
    # 因此这里必须重复声明全部安全响应头（SEC-P2-5）
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'self';" always;
        access_log off;
    }

    # 前端 SPA 路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker 不缓存
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        expires 0;
    }

    # ========== 后端 API 反向代理 ==========
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # 文件上传代理
    location /api/upload/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 上传文件访问
    location /uploads/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Actuator 监控端点（仅允许内网访问）
    location /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://backend:8081;
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
